<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pemesanan Pizza</title>
  </head>

  <body>
    <h1>Form Pemesanan Pizza</h1>
    <p>Silahkan isi form di bawah ini untuk memesan pizza</p>

    <form action="http://www.blackgoosebistro.com/pizza.php" method="POST">
        <fieldset>
            <legend>Informasi Pemesan</legend>
            <p>
                <label for="customername">Name:</label>
                <input type="text" name="customername" id="customername" />
            </p>
                
            <p>
                <label for="address">Address:</label>
                <input type="text" name="address" id="address" />
            </p>

            <p>
                <label for="telephone">Phone:</label>
                <input type="text" name="telephone" id="telephone" />
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" />
            </p>

            <p>
                <label for="instructions">Delivery Instruction:</label><br>
                <textarea
                    name="instructions"
                    id="instructions"
                    rows="4"
                    cols="50"
                    maxlength="400"
                    placeholder="No more than 400 characters"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Design Your Dream Pizza</legend>
            <p><strong>Pizza Specs</strong></p>
            <p>Pilih Salah Satu</p>

            <p>
                <input type="radio" name="crust" id="classic" value="classic white" />
                <label for="classic">Classic White</label><br>

                <input type="radio" name="crust" id="pepperoni" value="pepperoni" />
                <label for="pepperoni">Pepperoni</label><br>

                <input type="radio" name="crust" id="chicken" value="Chicken" />
                <label for="chicken">Chicken</label>
            </p>

            <p><strong>Toppings</strong></p>

            <p>
                <input type="checkbox" name="toppings[]" id="red-sauce" value="red-sauce" />
                <label for="red-sauce">Red Sauce</label><br>

                <input type="checkbox" name="toppings[]" id="white-sauce" value="white-sauce" />
                <label for="white-sauce">White Sauce</label><br>

                <input type="checkbox" name="toppings[]" id="mozzarella" value="mozzarella" />
                <label for="mozzarella">Mozzarella Cheese</label><br>

                <input type="checkbox" name="toppings[]" id="cheese" value="cheese" />
                <label for="cheese">Cheese</label>
            </p>

            <p><strong>Number</strong></p>
            <p>
                <label for="pizzas">How many pizzas:</label>
                <select name="pizzas" id="pizzas" required>
                    <option value="" disabled selected>Pilih Jumlah</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Bring me a pizza!" />
            <input type="reset" value="Reset" />
        </p>
    </form>
  </body>
</html>
